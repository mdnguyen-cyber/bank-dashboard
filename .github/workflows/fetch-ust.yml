name: Cập nhật nhanh UST (đấu thầu, nắm giữ)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_ust.py
      - run: |
          git config user.name "fs-data-bot"
          git config user.email "fs-data-bot@users.noreply.github.com"
          git add data/global/ust.json
          git diff --cached --quiet && exit 0
          git commit -m "UST: đấu thầu, nắm giữ (tự động)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
