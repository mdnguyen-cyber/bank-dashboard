name: Cập nhật số liệu quốc tế (FRED, NY Fed, DBnomics)
on:
  schedule:
    - cron: '17 23 * * *'   # 06:17 giờ Việt Nam mỗi ngày (sau H.4.1 của Fed tối thứ Năm giờ Mỹ)
    - cron: '47 9 * * 1-5'  # 16:47 giờ Việt Nam: tỷ giá ECB, Vietcombank, JGB trong ngày
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: fetch-global
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tải chuỗi số liệu
        run: |
          pip install -q openpyxl xlrd
          python scripts/fetch_global.py
          python scripts/fetch_ust.py || echo "fetch_ust lỗi"
          python scripts/fetch_jp.py || echo "fetch_jp lỗi"
          python scripts/fetch_jgb_auct.py || echo "fetch_jgb_auct lỗi"
          python scripts/fetch_daily.py || echo "fetch_daily lỗi"
          python scripts/fetch_fedwatch.py || echo "fetch_fedwatch lỗi"
          python scripts/fetch_ois.py || echo "fetch_ois lỗi"
          python scripts/fetch_calendar.py || echo "fetch_calendar lỗi"
          python scripts/fetch_dlkt.py || echo "fetch_dlkt lỗi"
          python scripts/fetch_market.py || echo "fetch_market lỗi"
          python scripts/fetch_cmd.py || echo "fetch_cmd lỗi"
          FORCE=${{ github.event_name == 'workflow_dispatch' && '1' || '0' }} python scripts/fetch_hm_hist.py || echo "fetch_hm_hist lỗi"
      - name: Dựng dữ liệu cho trang
        run: |
          if [ -f scripts/build_global.py ]; then python scripts/build_global.py; fi
          python scripts/build_calendar.py || echo "build_calendar lỗi"
          python scripts/build_auto.py || echo "build_auto lỗi"
          python scripts/build_eco.py || echo "build_eco lỗi"
          python scripts/build_hm_hist.py || echo "build_hm_hist lỗi"
          python scripts/build_cmd.py || echo "build_cmd lỗi"
      - name: Commit nếu có số mới và deploy lại trang
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "fs-data-bot"
          git config user.email "fs-data-bot@users.noreply.github.com"
          git add -A data/global
          [ -f data/global-data.js ] && git add data/global-data.js
          [ -f data/fx-daily.js ] && git add data/fx-daily.js
          git add -A data/vn
          git add data/sector-data.js data/sector-data.json
          [ -f data/eco-data.js ] && git add data/eco-data.js
          [ -f data/hm-hist.js ] && git add data/hm-hist.js
          [ -f data/cmd-data.js ] && git add data/cmd-data.js
          git add -A data/calendar; [ -f data/calendar-data.js ] && git add data/calendar-data.js
          if git diff --cached --quiet; then echo "Không có số mới"; exit 0; fi
          git commit -m "Số liệu quốc tế $(date -u +%Y-%m-%d) (tự động)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          gh workflow run pages.yml --ref main
