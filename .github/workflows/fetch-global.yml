name: Cập nhật số liệu quốc tế (FRED, NY Fed, DBnomics)
on:
  schedule:
    - cron: '17 23 * * *'   # 06:17 giờ Việt Nam mỗi ngày (sau H.4.1 của Fed tối thứ Năm giờ Mỹ)
    - cron: '47 9 * * 1-5'  # 16:47 giờ Việt Nam: tỷ giá ECB, Vietcombank, JGB trong ngày
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: fetch-global
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tải chuỗi số liệu
        run: |
          pip install -q openpyxl xlrd
          python scripts/fetch_global.py
          python scripts/fetch_ust.py || echo "fetch_ust lỗi"
          python scripts/fetch_jp.py || echo "fetch_jp lỗi"
          python scripts/fetch_daily.py || echo "fetch_daily lỗi"
          python scripts/fetch_fedwatch.py || echo "fetch_fedwatch lỗi"
      - name: Dựng dữ liệu cho trang
        run: |
          if [ -f scripts/build_global.py ]; then python scripts/build_global.py; fi
      - name: Commit nếu có số mới và deploy lại trang
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "fs-data-bot"
          git config user.email "fs-data-bot@users.noreply.github.com"
          git add -A data/global
          [ -f data/global-data.js ] && git add data/global-data.js
          [ -f data/fx-daily.js ] && git add data/fx-daily.js
          if git diff --cached --quiet; then echo "Không có số mới"; exit 0; fi
          git commit -m "Số liệu quốc tế $(date -u +%Y-%m-%d) (tự động)"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
          gh workflow run pages.yml --ref main
