name: Thử tải VIRA Market Watch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/vira_probe.py
      - run: |
          git config user.name "fs-data-bot"; git config user.email "fs-data-bot@users.noreply.github.com"
          git add -A data/vira; git commit -m "Thử VIRA (tạm)" && git push || true
