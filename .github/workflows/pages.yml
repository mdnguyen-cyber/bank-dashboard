name: Deploy dashboard lên GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # 1) Đưa trang lên ngay (khoảng 1 phút)
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gom file trang
        run: bash scripts/gom_site.sh
      # Giữ bộ PDF đang có trên web trong lúc job 2 dựng bộ mới (nút "Xuất PDF" không bị rơi về bản chụp)
      - name: Giữ PDF bản trước
        continue-on-error: true
        run: |
          U="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/pdf"
          mkdir -p _site/pdf
          curl -sfL "$U/index.json" -o _site/pdf/index.json || exit 0
          python3 -c "import json;[print(k) for k in json.load(open('_site/pdf/index.json'))['files']]" | while read k; do curl -sfL "$U/$k.pdf" -o "_site/pdf/$k.pdf" || true; done
          ls _site/pdf | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
  # 2) Dựng sẵn PDF chữ thật cho mọi tab rồi deploy lại kèm thư mục pdf/ (nút "Xuất PDF" tải các file này;
  #    trong lúc chờ hoặc nếu bước này lỗi, nút tự chuyển sang chụp bản đang xem)
  pdf:
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gom file trang
        run: bash scripts/gom_site.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dựng PDF các tab
        timeout-minutes: 20
        run: |
          npm i --no-save --no-package-lock playwright@1.47.2
          npx playwright install --with-deps chromium
          node scripts/build_pdfs.js _site
          N=$(ls _site/pdf/*.pdf | wc -l); echo "::notice title=PDF::$N file PDF, $(du -sh _site/pdf | cut -f1)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-pdf
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-pdf
