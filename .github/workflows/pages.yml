name: Deploy dashboard lên GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Chỉ đưa file cần để xem dashboard lên web; data/raw (response WiData gốc) và scripts không publish
      - name: Gom file trang
        run: |
          mkdir -p _site/data _site/assets
          cp index.html .nojekyll _site/
          cp assets/app.js assets/fin-success-logo.png _site/assets/
          cp data/ctg-data.js _site/data/
          # Gắn mã commit vào đường dẫn script để trình duyệt không dùng bản cache cũ sau mỗi lần deploy
          V=${GITHUB_SHA::7}
          sed -i "s|data/ctg-data.js\"|data/ctg-data.js?v=$V\"|; s|assets/app.js\"|assets/app.js?v=$V\"|" _site/index.html
          grep -n '?v=' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
