name: Deploy dashboard lên GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Chỉ đưa file cần để xem dashboard lên web; data/raw (response WiData gốc) và scripts không publish
      - name: Gom file trang
        run: |
          mkdir -p _site/data _site/assets
          cp index.html nganh.html .nojekyll _site/
          cp assets/app.js assets/sector.js assets/chartkit.js assets/fs.css assets/fin-success-logo.png _site/assets/
          cp data/ctg-data.js data/sector-data.js data/global-data.js _site/data/
          # Gắn mã commit vào đường dẫn script để trình duyệt không dùng bản cache cũ sau mỗi lần deploy
          V=${GITHUB_SHA::7}
          for f in _site/index.html _site/nganh.html; do
            sed -i -E "s#(data/[a-z-]+\.js|assets/[a-z]+\.js|assets/fs\.css)\"#\1?v=$V\"#g" "$f"
          done
          grep -n '?v=' _site/index.html _site/nganh.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
