name: Cập nhật thị trường tiền tệ (VIRA Market Watch)
on:
  schedule:
    - cron: '47 10 * * 1-5'   # 17:47 giờ Việt Nam các ngày làm việc
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Số trang danh sách cần quét (nạp lịch sử: 40)'
        default: '2'
permissions:
  contents: write
  actions: write
concurrency:
  group: fetch-vira
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cài OCR
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          pip install -q pillow pytesseract
      - name: Đọc bảng VNIBOR / SOFR
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages || '2' }}
        run: python scripts/fetch_vira.py
      - name: Dựng dữ liệu cho trang
        run: |
          if [ -f scripts/build_vira.py ]; then python scripts/build_vira.py; fi
      - name: Commit nếu có số mới và deploy lại trang
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "fs-data-bot"
          git config user.email "fs-data-bot@users.noreply.github.com"
          git add -A data/vira
          [ -f data/vira-data.js ] && git add data/vira-data.js
          if git diff --cached --quiet; then echo "Không có số mới"; exit 0; fi
          git commit -m "Thị trường tiền tệ VIRA $(date -u +%Y-%m-%d) (tự động)"
          git pull --rebase -q && git push
          gh workflow run pages.yml --ref main
